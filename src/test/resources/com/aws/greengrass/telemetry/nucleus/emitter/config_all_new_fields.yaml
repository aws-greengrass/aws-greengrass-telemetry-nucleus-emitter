---
services:
  aws.greengrass.Nucleus:
    configuration:
      runWithDefault:
        posixUser: nobody
  aws.greengrass.telemetry.NucleusEmitter:
    configuration:
      pubSubPublish: "true"
      mqttTopic: ""
      telemetryPublishIntervalMs: "60000"
      metricsLevel: "detailed"
      outputMode: "both"
      outputDirectory: "/tmp/greengrass/telemetry"
      excludeMounts:
        - "tmpfs"
        - "devtmpfs"
      excludeInterfaces:
        - "lo"
        - "docker0"
    dependencies:
      - "aws.greengrass.Nucleus:SOFT"
    version: "1.0.0"
  main:
    dependencies:
      - "aws.greengrass.telemetry.NucleusEmitter"
    lifecycle: {}
