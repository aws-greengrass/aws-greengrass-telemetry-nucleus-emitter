---
services:
  aws.greengrass.Nucleus:
    configuration:
      runWithDefault:
        posixUser: nobody
  aws.greengrass.telemetry.NucleusEmitter:
    configuration:
      pubSubPublish: "true"
      mqttTopic: ""
      telemetryPublishIntervalMs: "60000"
      metricsLevel: "basic"
      outputMode: "ipc"
      outputDirectory: "/tmp/greengrass/telemetry"
      excludeMounts: "tmpfs"
      excludeInterfaces:
        - "lo"
        - "docker0"
    dependencies:
      - "aws.greengrass.Nucleus:SOFT"
    version: "1.0.0"
  main:
    dependencies:
      - "aws.greengrass.telemetry.NucleusEmitter"
    lifecycle: {}
